<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iCatch | لحق — Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --background:#F1F5F9; --surface:#FFFFFF; --foreground:#1E293B;
  --card:#FFFFFF; --card-border:#E2E8F0; --muted:#F1F5F9; --muted-fg:#64748B;
  --border:#E2E8F0; --input-bg:#FFFFFF;
  --ring:rgba(37,99,235,.25); --radius:0.5rem;
  --primary:#2563EB; --primary-dk:#1D4ED8;
  --success:#2563EB; --success-bg:#EFF6FF; --success-bd:#BFDBFE;
  --warn-bg:#F1F5F9; --warn-bd:#CBD5E1; --warn-fg:#1E293B;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 8px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 24px rgba(0,0,0,.09),0 4px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);
  font-family:'Inter','Tajawal',ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";}
code,.mono{font-family:'JetBrains Mono',ui-monospace,'Cascadia Code',monospace}
.app{max-width:1320px;margin:0 auto;padding:28px 32px 80px}

.hero{background:#1E293B;color:#FFFFFF;padding:28px 36px;border-radius:1rem;
  margin-bottom:22px;display:flex;align-items:center;gap:22px;
  box-shadow:var(--shadow-lg);border:1px solid #334155;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--primary) 0%,#60A5FA 50%,transparent 100%);}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:32px 32px;}
.hero-icon{font-size:2.2rem;line-height:1;background:rgba(37,99,235,.18);
  border:1px solid rgba(37,99,235,.35);border-radius:.6rem;padding:12px 14px;
  flex-shrink:0;position:relative;z-index:1;}
.hero-text{position:relative;z-index:1}
.hero h1{margin:0;font-size:1.7rem;font-weight:700;letter-spacing:-.6px;line-height:1.15;color:#FFFFFF}
.hero h1 .ar{font-family:'Tajawal',sans-serif;font-weight:400;color:#CBD5E1;font-size:1.3rem;margin-left:6px}
.hero .tagline{font-size:.78rem;color:#94A3B8;margin:6px 0 0 0;font-weight:400;letter-spacing:.2px}
.hero .badges{margin-left:auto;display:flex;gap:8px;position:relative;z-index:1}
.hero-badge{background:rgba(37,99,235,.18);border:1px solid rgba(37,99,235,.40);
  border-radius:.5rem;padding:6px 12px;font-size:.72rem;font-weight:600;letter-spacing:.4px;color:#BFDBFE;}
.hero-badge.neutral{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#E2E8F0}

.view-toggle{display:flex;gap:8px;margin-bottom:18px;align-items:center}
.vt-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);
  color:var(--foreground);padding:8px 16px;border-radius:.5rem;font-size:.82rem;font-weight:500;
  cursor:pointer;transition:all .15s;box-shadow:var(--shadow-xs);font-family:inherit;}
.vt-btn:hover{background:var(--muted);border-color:#94A3B8}
.vt-btn.active{background:var(--primary);border-color:var(--primary-dk);color:#FFFFFF}
.vt-btn.active:hover{background:#1D4ED8}
.vt-spacer{flex:1}
.vt-meta{font-size:.72rem;color:var(--muted-fg);display:flex;align-items:center;gap:6px}
.vt-meta .live-dot{width:6px;height:6px;border-radius:50%;background:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.20);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.grid-2{display:grid;grid-template-columns:1.4fr 1.6fr;gap:22px;align-items:start}
@media (max-width:1024px){.grid-2{grid-template-columns:1fr}}

.section-header{font-size:1.05rem;font-weight:600;color:var(--foreground);
  margin:6px 0 12px 0;letter-spacing:-.2px;display:flex;align-items:center;gap:10px;}
.section-header .line{flex:1;height:1px;background:var(--border)}
.section-header .count{font-size:.7rem;font-weight:500;color:var(--muted-fg);
  background:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:999px;letter-spacing:.3px}

.fld-label{font-weight:500;font-size:.8rem;color:var(--muted-fg);display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.select{width:100%;background:var(--input-bg);border:1px solid var(--border);
  border-radius:.5rem;padding:8px 12px;font-size:.875rem;color:var(--foreground);
  box-shadow:var(--shadow-xs);font-family:inherit;height:2.25rem;cursor:pointer;
  appearance:none;padding-right:32px;

.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:.75rem;
  padding:20px 22px;box-shadow:var(--shadow-xs);}
.card-accent{border-left:3px solid var(--primary)}
.card-title{font-size:.68rem;font-weight:600;color:var(--muted-fg);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title .dot{width:5px;height:5px;border-radius:50%;background:var(--primary)}

.nsis-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar{width:44px;height:44px;background:linear-gradient(135deg,#2563EB,#60A5FA);color:#FFFFFF;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.95rem;font-weight:700;flex-shrink:0;box-shadow:var(--shadow-sm)}
.nsis-name{font-size:1rem;font-weight:600;color:var(--foreground);letter-spacing:-.2px}
.nsis-sub{font-size:.8rem;color:var(--muted-fg);margin-top:2px}
.nsis-avg-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.nsis-avg-row .lbl{font-size:.82rem;color:var(--muted-fg)}
.nsis-avg-row .val{font-size:1rem;font-weight:700;color:var(--foreground)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;
  font-size:.72rem;font-weight:600;letter-spacing:.1px;}
.badge.advanced{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.badge.intermediate{background:#F1F5F9;color:#1E293B;border:1px solid #CBD5E1}
.badge.beginner{background:#F1F5F9;color:#475569;border:1px solid #CBD5E1}
.scores-label{font-size:.72rem;color:var(--muted-fg);margin-bottom:6px;font-weight:500}
.scores-row{display:flex;gap:5px;flex-wrap:wrap}
.score-pill{background:var(--muted);border:1px solid var(--border);border-radius:999px;

.spark .bar{flex:1;background:linear-gradient(180deg,var(--primary),#60A5FA);border-radius:3px 3px 0 0;
  position:relative;min-height:4px}
.spark .bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:.65rem;font-weight:600;color:var(--muted-fg);white-space:nowrap}

.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;font-size:.875rem;align-items:baseline}
.kv .k{color:var(--muted-fg);font-weight:600;font-size:.78rem}
.kv .v{color:var(--foreground);line-height:1.5}
.kv .v code{background:var(--muted);color:var(--primary);padding:2px 6px;border-radius:4px;
  font-size:.78em;border:1px solid var(--border)}

.alert{border-radius:.5rem;padding:12px 14px;font-size:.875rem;line-height:1.55;margin:14px 0;
  display:flex;gap:10px;align-items:flex-start;}
.alert-warn{background:var(--warn-bg);border:1px solid var(--warn-bd);border-left:3px solid var(--primary);color:var(--warn-fg)}
.alert .ic{flex-shrink:0;margin-top:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:.5rem;padding:9px 16px;font-size:.875rem;font-weight:500;
  border:1px solid transparent;cursor:pointer;transition:all .15s cubic-bezier(.4,0,.2,1);
  font-family:inherit;height:2.25rem;}
.btn-primary{background:var(--primary);border-color:var(--primary-dk);color:#FFFFFF;box-shadow:var(--shadow-xs)}
.btn-primary:hover{background:#1D4ED8;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.btn-secondary{background:#FFFFFF;border-color:var(--border);color:var(--foreground);box-shadow:var(--shadow-xs)}
.btn-secondary:hover{background:var(--muted);border-color:#94A3B8}
.btn-block{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}

.prefs{display:grid;gap:4px;padding:16px 18px;background:var(--muted);border:1px solid var(--border);
  border-radius:.6rem;margin-top:12px}
.prefs-title{font-size:.68rem;font-weight:600;color:var(--muted-fg);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.prefs-title .dot{width:5px;height:5px;border-radius:50%;background:var(--primary)}

.switch-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 2px;}
.switch-row + .switch-row{border-top:1px solid var(--border)}
.switch-row .meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;cursor:pointer}
.switch-row .meta .name{font-size:.88rem;font-weight:600;color:var(--foreground);line-height:1.3;display:flex;align-items:center;gap:6px}
.switch-row .meta .desc{font-size:.76rem;color:var(--muted-fg);line-height:1.45}
.switch-row .meta .ar{font-family:'Tajawal',sans-serif;color:#94A3B8;font-weight:500;font-size:.78rem}

.switch{--thumb-size:18px;display:inline-flex;align-items:center;flex-shrink:0;
  height:calc(var(--thumb-size) + 4px);width:calc(var(--thumb-size) * 2 + 2px);
  border-radius:999px;padding:2px;outline:none;
  transition:background-color .2s,box-shadow .2s;cursor:pointer;
  border:1px solid transparent;}
.switch[data-checked]{background:var(--primary);border-color:var(--primary-dk);box-shadow:var(--shadow-xs)}
.switch[data-unchecked]{background:#CBD5E1;border-color:#94A3B8}
.switch:focus-visible{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--ring)}
.switch[data-disabled]{opacity:.5;cursor:not-allowed}
.switch .thumb{display:block;aspect-ratio:1/1;height:100%;
  border-radius:999px;background:#FFFFFF;
  box-shadow:0 1px 2px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);
  will-change:transform;transition:translate .18s cubic-bezier(.4,0,.2,1),scale .1s;}
.switch[data-checked] .thumb{translate:calc(var(--thumb-size) - 2px) 0}
.switch:active:not([data-disabled]) .thumb{scale:1.08 1}

.pack{display:grid;gap:8px;margin-top:14px}
.pack-item{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:#FFFFFF;border:1px solid var(--border);border-radius:.5rem;
  box-shadow:var(--shadow-xs);font-size:.85rem;color:var(--foreground);
  transition:all .2s cubic-bezier(.4,0,.2,1);}
.pack-item.off{opacity:.4;background:var(--muted);filter:saturate(.4)}
.pack-item .tick{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem;font-weight:700}
.pack-item.on .tick{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.pack-item.off .tick{background:var(--muted);color:var(--muted-fg);border:1px solid var(--border)}
.pack-item .ic{font-size:1rem;line-height:1}
.pack-item .pack-label{flex:1;font-weight:500}
.pack-item .pack-meta{font-size:.72rem;color:var(--muted-fg);font-weight:500}

.sent-box{background:linear-gradient(180deg,#EFF6FF,#FFFFFF);border:1px solid var(--success-bd);
  border-radius:.75rem;padding:18px 20px;}
.sent-title{font-size:.95rem;font-weight:700;color:#1E293B;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sent-sub{font-size:.8rem;color:#1D4ED8;opacity:.9}

.footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  font-size:.72rem;color:var(--muted-fg);letter-spacing:.2px;flex-wrap:wrap;gap:10px;}
.footer .brand{display:flex;align-items:center;gap:8px}
.footer .brand strong{color:var(--foreground);font-weight:600}
.footer .dot-sep{margin:0 8px;opacity:.5}

.tweaks{position:fixed;right:20px;bottom:20px;width:300px;background:#FFFFFF;
  border:1px solid var(--border);border-radius:.75rem;box-shadow:var(--shadow-lg);
  padding:16px 18px;z-index:100;display:none;}
.tweaks.open{display:block}
.tweaks h4{margin:0 0 12px;font-size:.75rem;font-weight:700;color:var(--foreground);
  text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.tweaks h4 .dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.tweak-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border)}
.tweak-row:first-of-type{border-top:none}
.tweak-row label{font-size:.8rem;color:var(--foreground);font-weight:500}
.tweak-swatches{display:flex;gap:6px}
.tweak-swatch{width:22px;height:22px;border-radius:50%;border:2px solid #FFFFFF;box-shadow:0 0 0 1px var(--border);cursor:pointer}
.tweak-swatch.active{box-shadow:0 0 0 2px var(--foreground)}

@media (max-width:768px){
  .app{padding:16px}
  .hero{padding:20px 22px;flex-wrap:wrap}
  .hero .badges{margin-left:0;width:100%;margin-top:10px}
}
</style>
</head>

<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect } = React;

function Switch({ checked, defaultChecked = false, onCheckedChange, disabled = false, id }) {
  const isControlled = checked !== undefined;
  const [internal, setInternal] = useState(defaultChecked);
  const state = isControlled ? checked : internal;
  const toggle = () => {
    if (disabled) return;
    const next = !state;
    if (!isControlled) setInternal(next);
    onCheckedChange && onCheckedChange(next);
  };
  const onKey = (e) => {
    if (e.key === " " || e.key === "Enter") {e.preventDefault();toggle();}
  };
  return (
    <button
      type="button" role="switch"
      aria-checked={state}
      aria-disabled={disabled || undefined}
      data-slot="switch"
      data-checked={state ? "" : undefined}
      data-unchecked={!state ? "" : undefined}
      data-disabled={disabled ? "" : undefined}
      disabled={disabled}
      onClick={toggle} onKeyDown={onKey}
      id={id}
      className="switch">
      
      <span className="thumb" data-slot="switch-thumb" />
    </button>);

}

const STUDENTS = {

{ mod: "Module 1: People", name: "Phonics: oi and oy sounds /ɔɪ/", type: "Phonics", objective: "Read and pronounce words with oi and oy spelling patterns", rule: "oi (middle): coin, boil — oy (end): boy, enjoy.", standards: ["R4.1", "L1.1"] },
{ mod: "Module 2: Looking Back", name: "Past Simple of be (was / were)", type: "Grammar", objective: "Use was and were in affirmative, negative, and question forms", rule: "I/He/She was. You/We/They were. Q: Was I? Were you?", standards: ["W1.6", "S2.5", "L2.1"] },
{ mod: "Module 2: Looking Back", name: "Past Simple (Regular and Irregular Verbs)", type: "Grammar", objective: "Form and use Past Simple with regular and irregular verbs", rule: "+ed for regulars. Irregular: go→went, see→saw, have→had.", standards: ["W1.6", "S2.5", "L2.1"] },
{ mod: "Module 3: Let's Learn!", name: "Comparative Form of Adjectives", type: "Grammar", objective: "Form and use comparative adjectives to compare two things", rule: "Short +er (older). Long: more + adj. Irregular: good→better.", standards: ["W1.3", "S2.2", "W1.2"] },
{ mod: "Module 3: Let's Learn!", name: "Superlative Form of Adjectives", type: "Grammar", objective: "Form and use superlative adjectives", rule: "the + -est / the most + adj. Irregular: the best, the worst.", standards: ["W1.3", "S2.2", "W1.2"] },
{ mod: "Module 4: What Happened?", name: "Past Progressive", type: "Grammar", objective: "Use Past Progressive for actions at a specific time in the past", rule: "was/were + -ing. E.g. I was tidying my room at 7.", standards: ["W1.6", "S2.5", "L2.1"] },

const DEFAULT_PREFS = {
  miniLesson: { on: true, label: "Personalised Micro-Lesson", ar: "درس مصغّر", desc: "AI-generated 200–260 word catch-up adapted to student level", icon: "📖" },
  worksheet: { on: true, label: "Practice Worksheet", ar: "ورقة تدريب", desc: "3 exercises: fill-in-blanks, MCQ, free writing", icon: "📝" },
  quiz: { on: true, label: "5-Question Quiz", ar: "اختبار قصير", desc: "Multiple-choice knowledge check with auto-grading", icon: "✅" },
  interactive: { on: true, label: "Interactive Slide Lesson", ar: "درس تفاعلي", desc: "4-slide HTML lesson — learning goal, rule, examples, tip", icon: "🎞️" },
  arabicSupport: { on: false, label: "Arabic Support Text", ar: "دعم بالعربية", desc: "Add Tajawal-typed translations under English sentences", icon: "🌐" },
  parentNotify: { on: true, label: "Notify Parent via SMS", ar: "إشعار ولي الأمر", desc: "Send summary to parent's registered number", icon: "📱" },

function Hero({ apiOk }) {
  return (
    <header className="hero" data-screen-label="Hero">
      <div className="hero-icon">
</div>
      <div className="hero-text">
        <h1>iCatch<span className="ar"> | لحق</span></h1>
        <p className="tagline">AI-Powered Recovery &nbsp;·&nbsp; No Student Left Behind &nbsp;·&nbsp; Qatar MoEHE</p>
      </div>
      <div className="badges">
        <span className="hero-badge neutral">sign in</span>
        <span className="hero-badge">{apiOk ? "● Gemini · Live" : "○ API · Offline"}</span>
      </div>
    </header>);
}

function NSIS({ name, data }) {
  const initials = name.split(" ").slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  return (
    <div className="card">
      <div className="card-title"><span className="dot" />NSIS — Academic Record</div>
      <div className="nsis-head">
        <div className="avatar">{initials}</div>
        <div style={{ minWidth: 0 }}>
          <div className="nsis-name">{name} <span style={{ opacity: .4, margin: "0 6px" }}>|</span> <span style={{ fontFamily: "'Tajawal',sans-serif", fontWeight: 500 }}>{data.ar}</span></div>
          <div className="nsis-sub">Grade {data.grade} · Section {data.section} · Top Stars Textbook</div>
        </div>
      </div>
      <div className="nsis-avg-row">
        <span className="lbl">English Average</span>
        <span className="val">{data.avg}%</span>
        <span className={`badge ${data.level.toLowerCase()}`}>{data.level} · <span style={{ fontFamily: "'Tajawal',sans-serif", marginLeft: 3 }}>{data.level_ar}</span></span>
      </div>
      <div className="scores-label">Recent quiz scores</div>
      <div className="scores-row">
        {data.recent.map((s, i) => <span key={i} className="score-pill">Q{i + 1} · {s}</span>)}
      </div>
      <div className="spark" aria-hidden="true">
        {data.recent.map((s, i) =>
        <div key={i} className="bar" style={{ height: `${s / 100 * 58}px` }}>
            <span className="val">{s}</span>
          </div>
        )}
      </div>
    </div>);

}

function LessonCard({ lesson }) {
  return (
    <div className="card card-accent" style={{ marginTop: 12 }}>
      <div className="card-title"><span className="dot" />Lesson Posted by Teacher</div>
      <div className="kv">
        <span className="k">Unit</span><span className="v">{lesson.mod}</span>
        <span className="k">Type</span><span className="v">{lesson.type}</span>
        <span className="k">Objective</span><span className="v">{lesson.objective}</span>
        <span className="k">Key Rule</span><span className="v"><code>{lesson.rule}</code></span>
        <span className="k">Standards</span>
        <span className="v" style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {lesson.standards.map((s) =>
          <span key={s} className="mono" style={{ background: "var(--muted)", border: "1px solid var(--border)", borderRadius: 4, padding: "1px 8px", fontSize: ".72rem", color: "var(--muted-fg)" }}>{s}</span>
          )}
        </span>
      </div>
    </div>);

}

function DeliveryPrefs({ prefs, setPref }) {
  return (
    <div className="prefs" role="group" aria-labelledby="prefs-heading">
      <div id="prefs-heading" className="prefs-title"><span className="dot" />Delivery Preferences</div>
      {Object.entries(prefs).map(([key, p]) =>
      <div key={key} className="switch-row">
          <label className="meta" htmlFor={`sw-${key}`}>
            <span className="name">
              <span aria-hidden="true">{p.icon}</span>
              {p.label}
              <span className="ar">· {p.ar}</span>
            </span>
            <span className="desc">{p.desc}</span>
          </label>
          <Switch
          id={`sw-${key}`}
          checked={p.on}
          onCheckedChange={(v) => setPref(key, v)} />
        
        </div>
      )}
    </div>);

}

function PackPreview({ prefs }) {
  const items = [
  { key: "miniLesson", meta: "≈240 words" },
  { key: "worksheet", meta: "3 exercises" },
  { key: "quiz", meta: "5 MCQs" },
  { key: "interactive", meta: "4 slides" },
  { key: "arabicSupport", meta: "bilingual" },
  { key: "parentNotify", meta: "SMS" },
  { key: "teacherReview", meta: "hold" }];

  const active = items.filter((i) => prefs[i.key]?.on).length;
  return (
    <div style={{ marginTop: 18 }}>
      <div className="section-header" style={{ marginBottom: 10 }}>
        Pack Preview <span className="count">{active}/{items.length} on</span>
        <div className="line" />
      </div>
      <div className="pack">
        {items.map(({ key, meta }) => {
          const p = prefs[key];
          return (
            <div key={key} className={`pack-item ${p.on ? "on" : "off"}`}>
              <span className="tick">{p.on ? "✓" : "–"}</span>
              <span className="ic" aria-hidden="true">{p.icon}</span>
              <span className="pack-label">{p.label}</span>
              <span className="pack-meta">{meta}</span>
            </div>);

        })}
      </div>
    </div>);

}

function App() {
  const [view, setView] = useState("teacher");
  const [studentName, setStudentName] = useState("Lina Al-Mansouri");
  const [lessonIdx, setLessonIdx] = useState(3);
  const [prefs, setPrefs] = useState(DEFAULT_PREFS);
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [accent, setAccent] = useState("#2563EB");

  const student = STUDENTS[studentName];
  const lesson = LESSONS[lessonIdx];

  const setPref = (key, on) => setPrefs((prev) => ({ ...prev, [key]: { ...prev[key], on } }));

  const send = () => {
    setSending(true);
    setTimeout(() => {setSending(false);setSent(true);}, 900);
  };

  useEffect(() => {setSent(false);}, [studentName, lessonIdx]);

  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  useEffect(() => {
    document.documentElement.style.setProperty("--primary", accent);
  }, [accent]);

  return (
    <div className="app">
      <Hero apiOk={true} />

      <div className="view-toggle">
        <button className={`vt-btn ${view === "teacher" ? "active" : ""}`} onClick={() => setView("teacher")}>
          <span>
</span> Teacher Dashboard
        </button>
        <button className={`vt-btn ${view === "student" ? "active" : ""}`} onClick={() => setView("student")}>
          <span>
</span> Student View
        </button>
        <div className="vt-spacer" />
        <div className="vt-meta"><span className="live-dot" /> RAG corpus loaded · {LESSONS.length * 4} chunks indexed</div>
      </div>

      <div className="section-header">
        Teacher Dashboard <span className="count">Recovery Pack Builder</span>
        <div className="line" />
      </div>

      <div className="grid-2">
        <div>
          <div className="field">
            <label className="fld-label" htmlFor="sel-student">Absent Student</label>
            <select id="sel-student" className="select" value={studentName} onChange={(e) => setStudentName(e.target.value)}>
              {Object.keys(STUDENTS).map((n) => <option key={n} value={n}>{n}  —  {STUDENTS[n].ar}</option>)}
            </select>
          </div>
          <NSIS name={studentName} data={student} />
        </div>

        <div>
          <div className="field">
            <label className="fld-label" htmlFor="sel-lesson">Today's Lesson (Qatar Platform)</label>
            <select id="sel-lesson" className="select" value={lessonIdx} onChange={(e) => setLessonIdx(+e.target.value)}>
              {LESSONS.map((l, i) => <option key={i} value={i}>{l.mod} — {l.name}</option>)}
            </select>
          </div>
          <LessonCard lesson={lesson} />

          <div className="alert alert-warn" role="status">
            <span className="ic">⚠️</span>
            <div>
              <b>Absence detected</b> — {studentName} (<span style={{ fontFamily: "'Tajawal',sans-serif" }}>{student.ar}</span>) was marked absent today.<br />
              <span style={{ opacity: .85 }}>Level from NSIS: <b>{student.level}</b> · the pack will be tailored automatically.</span>
            </div>
          </div>

          <DeliveryPrefs prefs={prefs} setPref={setPref} />
          <PackPreview prefs={prefs} />

          <div style={{ marginTop: 18 }}>
            {!sent ? <button className="btn btn-primary btn-block" onClick={send} disabled={sending}>
                {sending ? <><span>⏳</span> Building pack with Gemini…</> :
              <><span>✨</span> Generate &amp; Send Recovery Pack</>}
              </button> :

            <div className="sent-box" role="status">
                <div className="sent-title">✅ Recovery pack sent successfully</div>
                <div className="sent-sub">
                  {studentName} has been notified{prefs.parentNotify.on ? " · parent SMS dispatched" : ""}{prefs.teacherReview.on ? " · awaiting your review first" : ""}.
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                  <button className="btn btn-secondary" onClick={() => setSent(false)}>Edit &amp; resend</button>
                  <button className="btn btn-secondary" onClick={() => setView("student")}>Open Student View →</button>
                </div>
              </div>
            }
          </div>
        </div>
      </div>

      <footer className="footer">
        <div className="brand">
          <strong>iCatch</strong>
          <span style={{ fontFamily: "'Tajawal',sans-serif" }}>| لحق</span>
          <span className="dot-sep">·</span>
          <span>Ministry of Education &amp; Higher Education, Qatar</span>
        </div>
        <div>
          <span className="mono">v0.4.0-prototype</span>
          <span className="dot-sep">·</span>
          <span>Developed by Marwa Alkuwari</span>
        </div>
      </footer>

      <div className={`tweaks ${tweaksOpen ? "open" : ""}`}>
        <h4><span className="dot" /> Tweaks</h4>
        <div className="tweak-row">
          <label>Brand accent</label>
          <div className="tweak-swatches">
            {["#2563EB", "#1E293B", "#0F172A", "#64748B", "#60A5FA"].map((c) =>
            <span key={c} className={`tweak-swatch ${c === accent ? "active" : ""}`}
            style={{ background: c }} onClick={() => setAccent(c)} role="button" aria-label={`Accent ${c}`} />
            )}
          </div>
        </div>
        <div className="tweak-row">
          <label htmlFor="tw-ar">Master: Bilingual UI</label>
          <Switch id="tw-ar" checked={prefs.arabicSupport.on} onCheckedChange={(v) => setPref("arabicSupport", v)} />
        </div>
        <div className="tweak-row">
          <label htmlFor="tw-pn">Master: Parent notify</label>
          <Switch id="tw-pn" checked={prefs.parentNotify.on} onCheckedChange={(v) => setPref("parentNotify", v)} />
        </div>
      </div>
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
